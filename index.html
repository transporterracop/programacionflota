.ev-off{background:#eef1f5;border:1px solid #e2e7ee;opacity:.6;box-shadow:none;margin-bottom:6px;min-height:71px;display:flex;align-items:center;justify-content:center} .ev-off .bd{padding:9px 8px;width:100%} .ev-off .off-li{justify-content:center;text-align:center;color:#9aa6b4;font-weight:600;font-size:11px;letter-spacing:.6px;text-transform:uppercase} .defw{color:#64748b;font-weight:400} .baliza{margin-left:5px;vertical-align:-3px;opacity:1 !important;color:#ff1500;transform-origin:center;animation:balFlash .6s steps(1,end) infinite, balMove 1.1s ease-in-out infinite} @keyframes balFlash{0%,49%{color:#ff1500;filter:drop-shadow(0 0 3px rgba(255,21,0,.95))}50%,100%{color:#1f6bff;filter:drop-shadow(0 0 3px rgba(31,107,255,.95))}} @keyframes balMove{0%,100%{transform:translateX(-1px) rotate(-7deg)}50%{transform:translateX(1px) rotate(7deg)}} </style>
<style>

<style>

<div class='wrap'>
  <div class='top'>
    <div class='brand' id='brand'></div><div class='title'>
      <h1 id='titulo'>Programaci&oacute;n de Camiones</h1>

    </div>
    <div class='kpis' id='kpis'></div>
    <div class='datebox'>
      <div class='r'><svg viewBox='0 0 24 24' width='15' height='15' fill='#cfe0f2'><path d='M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 8v9H5v-9h14Z'/></svg> <span id='rango'></span></div>
      <div class='u'>&Uacute;ltima actualizaci&oacute;n: <b id='upd'></b></div>
    </div>
    </div>  <div class='filters'><div class='fg'><label>Desde</label><input type='date' id='fDesde'></div><div class='fg'><label>Hasta</label><input type='date' id='fHasta'></div><div class='fg'><label>Cliente</label><select id='fCli'></select></div><div class='fg'><label>Conductor</label><select id='fCon'></select></div><div class='fg'><label>Tracto</label><select id='fTracto'></select></div><div class='fg'><label>Semirremolque</label><select id='fSemi'></select></div><button id='fClr'>Limpiar</button></div>
  <div id='estadoCarga' class='estcarga'>Cargando…</div>
  <div class='card'>
    <div class='scroll'>
      <table>
        <thead><tr id='hrow'></tr></thead>
        <tbody id='body'></tbody>
      </table>
    </div>
  </div>

</div>
<script>
/* ============================================================
   PROGRAMACIÓN DE CAMIONES — TERRACOP
   Etapa 2: la página lee la programación desde la API (Google Sheets + Apps Script).
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbz7xf-KSnQD67QrjXjOlhVb4Qx_sQcu0AQ2POlLQeKyyEReBFF4q2JFz1Y75oDtjZi8/exec';
const REFRESCO_MS = 5 * 60 * 1000;          // recarga automática cada 5 minutos
const CACHE_KEY = 'tc_prog_cache_v1';

const DIAS_SEM = ['Domingo', 'Lunes', 'Martes', 'Mi&eacute;rcoles', 'Jueves', 'Viernes', 'S&aacute;bado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sept', 'oct', 'nov', 'dic'];
const KPI_DEF = [
  ['CARGA', 'En carga', '#16a34a'], ['TRANSITO', 'En tránsito', '#2563eb'],
  ['DESCARGA', 'En descarga', '#ea580c'], ['INTERNOS', 'Mov. internos', '#4ade80']];

const SVG_ST = {
  realizado: `<svg viewBox='0 0 24 24' width='12' height='12' fill='currentColor'><path d='M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.2-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z'/></svg>`,
  ejecucion: `<svg viewBox='0 0 24 24' width='12' height='12' fill='currentColor'><path d='M8 5v14l11-7L8 5Z'/></svg>`,
  programado: `<svg viewBox='0 0 24 24' width='12' height='12' fill='currentColor'><path d='M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm12 8v9H5v-9h14Z'/></svg>`};
const LBL_ST = { realizado: 'Realizado', ejecucion: 'En ejecuci&oacute;n', programado: 'Programado' };
const SVG_USER = `<svg viewBox='0 0 24 24' width='13' height='13' fill='currentColor'><path d='M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5Z'/></svg>`;
const SVG_TRUCK = `<svg viewBox='0 0 24 24' width='13' height='13' fill='currentColor'><path d='M2 6h11v9H2V6Zm12 3h4l3 4v3h-7V9ZM6.5 20a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Zm11 0a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z'/></svg>`;
const kTruck = col => `<svg viewBox='0 0 24 24' fill='${col}'><path d='M2 6h11v9H2V6Zm12 3h4l3 4v3h-7V9ZM6.5 20a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Zm11 0a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z'/></svg>`;
const K_INT = `<svg viewBox='0 0 24 24' fill='#15803d'><path d='M12 3 3 8v8l9 5 9-5V8l-9-5Zm0 2.3 6.5 3.6L12 12.5 5.5 8.9 12 5.3Z'/></svg>`;
const BEACON = `<svg class='baliza' viewBox='0 0 24 24' width='14' height='14' fill='currentColor'><path d='M11 3.5a1 1 0 0 1 2 0V5a5 5 0 0 1 4 4.9V13H7V9.9A5 5 0 0 1 11 5V3.5Z'/><rect x='5' y='13' width='14' height='2.6' rx='1'/><rect x='11' y='15.6' width='2' height='3.4'/><path d='M3.6 8.4 5 9M20.4 8.4 19 9M2.8 12h1.6M19.6 12h1.6' fill='none' stroke='currentColor' stroke-width='1.4' stroke-linecap='round'/></svg>`;

// ---------- Estado global ----------
let DB = null;        // última respuesta de la API
let DIAS = [];        // fechas ISO visibles
let cargando = false;
let rangoManual = false;
let EDIT = null;          // sesión de edición {pin, nombre, rol} o null
const SVG_PEN = `<svg viewBox='0 0 24 24' width='12' height='12' fill='currentColor'><path d='M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25Zm17.7-10.2a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83Z'/></svg>`;  // true cuando el usuario pidió fechas fuera del rango por defecto

// ---------- Utilidades ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const desdeIso = s => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const sumarDias = (s, n) => { const d = desdeIso(s); d.setDate(d.getDate() + n); return isoLocal(d); };
const hoyIso = () => isoLocal(new Date());
const fechaCorta = s => { const d = desdeIso(s); return String(d.getDate()).padStart(2, '0') + '-' + MESES[d.getMonth()]; };
const fechaLarga = s => { const d = desdeIso(s); return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear(); };
const claseCod = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function estadoDia(f) { const h = hoyIso(); return f < h ? 'realizado' : (f === h ? 'ejecucion' : 'programado'); }
function defw(txt) {
  const s = esc(txt);
  return s.toUpperCase().indexOf('DEFINIR') === -1 ? s : s.replace(/DEFINIR/gi, "<span class='defw'>DEFINIR" + BEACON + '</span>');
}
// Mezcla un color con blanco (para fondos suaves) y lo oscurece (para textos)
function mezclar(hex, conBlanco) {
  let h = String(hex || '#94a3b8').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.round(conBlanco >= 0 ? v + (255 - v) * conBlanco : v * (1 + conBlanco));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function textoSobre(hex) {
  let h = String(hex || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); const l = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  return l > 0.6 ? '#422006' : '#ffffff';
}

// ---------- Estilos dinámicos (colores de estados y tipos desde la base) ----------
function aplicarEstilos() {
  const css = [];
  (DB.estados || []).forEach(e => {
    const k = 's-' + claseCod(e.codigo), c = e.color || '#94a3b8';
    css.push(`.${k}{border-color:${mezclar(c, .65)}}.${k} .hd{background:${mezclar(c, .9)};color:${mezclar(c, -.25)}}.${k} .dot{background:${c}}`);
  });
  (DB.tiposServicio || []).forEach(t => {
    const k = claseCod(t.codigo), c = t.color || '#94a3b8';
    css.push(`.b-${k}{background:${c};color:${textoSobre(c)}}.x-${k}{border-left:4px ${k === 'RET' ? 'dashed' : 'solid'} ${c}}`);
  });
  $('dynCss').textContent = css.join('\n');
}

// ---------- Carga de datos ----------
let _promCarga = null;
function cargar(desde, hasta) {
  if (_promCarga) return _promCarga;
  _promCarga = _cargar(desde, hasta).finally(() => { _promCarga = null; });
  return _promCarga;
}
async function _cargar(desde, hasta) {
  cargando = true;
  setEstadoCarga('Actualizando…');
  try {
    const q = new URLSearchParams({ accion: 'datos' });
    if (desde) q.set('desde', desde);
    if (hasta) q.set('hasta', hasta);
    const r = await fetch(API_URL + '?' + q.toString(), { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Error desconocido');
    DB = d;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) { /* sin almacenamiento */ }
    render();
    setEstadoCarga('');
  } catch (err) {
    setEstadoCarga('Sin conexión con la base de datos' + (DB ? ' — mostrando la última versión cargada' : ''), true);
    if (!DB) mostrarError(err);
  } finally { cargando = false; }
}
function setEstadoCarga(txt, error) {
  const e = $('estadoCarga'); if (!e) return;
  e.textContent = txt; e.className = 'estcarga' + (error ? ' err' : '') + (txt ? '' : ' oculto');
}
function mostrarError(err) {
  $('body').innerHTML = `<tr><td colspan='40' style='padding:40px;text-align:center;color:#b91c1c;font-size:13px'>No se pudo cargar la programación (${esc(err.message || err)}).<br><br><button class='btnr' onclick='cargar()'>Reintentar</button></td></tr>`;
}

// ---------- Cálculos ----------
function indexar() {
  const celdas = {};   // filaId|fecha -> asignación
  DB.programacion.forEach(p => { celdas[p.filaId + '|' + p.fecha] = p; });
  const kpiDe = {}; (DB.estados || []).forEach(e => { kpiDe[e.codigo] = e.kpi; });
  const flota = (DB.tractos || []).filter(t => t.activo && t.propio).map(t => t.patente);
  const porDia = {};
  DIAS.forEach(f => {
    const usados = new Set(), fs = [], kpi = { CARGA: 0, TRANSITO: 0, DESCARGA: 0, INTERNOS: 0 };
    DB.filas.forEach(fl => {
      const p = celdas[fl.id + '|' + f]; if (!p) return;
      if (p.tracto) usados.add(p.tracto);
      const k = kpiDe[p.estado]; if (k && kpi[k] != null) kpi[k]++;
    });
    DB.fueraServicio.forEach(x => { if (x.desde <= f && x.hasta >= f && fs.indexOf(x.tracto) < 0) fs.push(x.tracto); });
    const disp = flota.filter(t => !usados.has(t) && fs.indexOf(t) < 0);
    porDia[f] = { kpi, fs, disp };
  });
  return { celdas, porDia };
}

// ---------- Dibujo ----------
function render() {
  aplicarEstilos();
  DIAS = []; for (let f = DB.desde; f <= DB.hasta; f = sumarDias(f, 1)) DIAS.push(f);
  const { celdas, porDia } = indexar();
  const nomEstado = {}; (DB.estados || []).forEach(e => { nomEstado[e.codigo] = e.nombre || e.codigo; });
  const nomTipo = {}; (DB.tiposServicio || []).forEach(t => { nomTipo[t.codigo] = t.nombre || t.codigo; });
  const cli = {}; (DB.clientes || []).forEach(c => { cli[c.nombre] = c; });
  const hoy = hoyIso(), hd = porDia[hoy];

  // Encabezado
  document.title = (DB.config.Titulo || 'Programación de Camiones');
  $('titulo').textContent = DB.config.Titulo || 'Programación de Camiones';
  $('rango').textContent = fechaLarga(DB.desde) + ' – ' + fechaLarga(DB.hasta);
  $('upd').textContent = DB.ultimaActualizacion || '—';
  $('brand').innerHTML = `<img src='Logos/TERRACOP.png' alt='TERRACOP'>`;

  // KPIs del día de hoy
  const v = x => hd ? x : '&mdash;';
  const kpis = KPI_DEF.map(k => [k[1], v(hd && hd.kpi[k[0]]), k[2], k[0] === 'INTERNOS' ? K_INT : kTruck(k[2])])
    .concat([['Tractos disp. hoy', v(hd && hd.disp.length), '#0ea5e9', kTruck('#0ea5e9')],
             ['Fuera de servicio', v(hd && hd.fs.length), '#dc2626', kTruck('#dc2626')]]);
  $('kpis').innerHTML = kpis.map(k => `<div class='kpi'><div class='ic'>${k[3]}</div><div><div class='lbl'>${k[0]}</div><div class='val' style='color:${k[2]}'>${k[1]}</div></div></div>`).join('');

  // Cabecera de la tabla
  $('hrow').innerHTML = `<th class='c1'>Cliente</th><th class='c2'>Origen</th><th class='c3'>Destino</th>` +
    DIAS.map(f => `<th class='day' data-f='${f}'>${DIAS_SEM[desdeIso(f).getDay()]}<span class='d2'>${fechaCorta(f)}</span><span class='d3' style='display:block;font-size:9px;font-weight:700;color:#0ea5e9;margin-top:2px'>${porDia[f].disp.length} disp.</span></th>`).join('');

  // Cuerpo
  if (!DB.filas.length) {
    $('body').innerHTML = `<tr><td colspan='${DIAS.length + 3}' class='vacio'><div class='vacio-in'>Aún no hay viajes programados.<span>Cuando se agreguen filas de viaje desde el modo edición aparecerán aquí.</span></div></td></tr>` + (EDIT ? filaAgregar() : '') + filasResumen(porDia);
  } else {
    $('body').innerHTML = DB.filas.map(fl => {
      const c = cli[fl.cliente] || {}, col = c.color || '#475569', fg = c.colorInicial || '#fff', ini = esc((fl.cliente || '?')[0]);
      const src = c.logo ? (/^https?:/i.test(c.logo) ? c.logo : 'Logos/' + c.logo) : '';
      const logo = src
        ? `<div class='logoimg'><img src='${esc(src)}' alt='${esc(fl.cliente)}' data-bg='${esc(col)}' data-fg='${esc(fg)}' data-ini='${ini}' onerror='logoFail(this)'></div>`
        : `<div class='logo' style='background:${esc(col)};color:${esc(fg)}'>${ini}</div>`;
      let tds = `<td class='c1${EDIT ? ' c1ed' : ''}' data-filaed='${fl.id}'>${EDIT ? `<span class='pen pen-c'>${SVG_PEN}</span>` : ''}<div class='cli'><div class='nm'>${esc(fl.cliente)}</div>${logo}</div></td><td class='c2 od'>${esc(fl.origen)}</td><td class='c3 od'>${esc(fl.destino)}</td>`;
      tds += DIAS.map(f => {
        const p = celdas[fl.id + '|' + f], st = estadoDia(f);
        if (!p) return `<td class='day' data-f='${f}' data-fila='${fl.id}'><div class='ev ev-off' data-con='S/M'><div class='bd'><div class='li off-li'>${EDIT ? '<span class="add">＋ Asignar</span>' : 'Sin movimiento'}</div></div></div></td>`;
        const tk = claseCod(p.tipo), tag = p.tipo ? (nomTipo[p.tipo] || p.tipo) : '';
        const eq = [p.tracto, p.semi].filter(Boolean).join(' / ') || '-';
        return `<td class='day' data-f='${f}' data-fila='${fl.id}'><div class='ev s-${claseCod(p.estado)} ${tk ? 'x-' + tk : ''} ev-${st}' data-con='${esc(p.conductor)}' data-tracto='${esc(p.tracto)}' data-semi='${esc(p.semi)}'>` +
          `<div class='hd'><span class='dot'></span>${esc(nomEstado[p.estado] || p.estado)}${tag ? `<span class='bg b-${tk}'>${esc(tag)}</span>` : ''}<span class='st st-${st}${tag ? '' : ' st-auto'}' title='${LBL_ST[st]}'>${SVG_ST[st]}</span></div>` +
          `<div class='bd'><div class='li'>${SVG_USER}${defw(p.conductor)}</div><div class='li'>${SVG_TRUCK}${defw(eq)}</div></div>${EDIT ? `<span class='pen'>${SVG_PEN}</span>` : ''}</div></td>`;
      }).join('');
      return `<tr data-cli='${esc(fl.cliente)}'>${tds}</tr>`;
    }).join('') + (EDIT ? filaAgregar() : '') + filasResumen(porDia);
  }
  llenarFiltros();
  aplicarFiltros();
  if (typeof despuesDeRender === 'function') despuesDeRender();
}

function filasResumen(porDia) {
  const fila = (titulo, fondo, color, lista) =>
    `<tr class='sumrow'><td class='c1' style='font-weight:700;font-size:12px;background:${fondo};color:${color}'>${titulo}</td><td class='c2 od' style='background:${fondo}'></td><td class='c3 od' style='background:${fondo}'></td>` +
    DIAS.map(f => `<td class='day' data-f='${f}' style='background:${fondo};font-size:12px;line-height:1.35;color:${color};vertical-align:top;white-space:normal;text-align:center'>${lista(f).length ? lista(f).map(esc).join('<br>') : '-'}</td>`).join('') + '</tr>';
  return fila('Fuera de servicio', '#fef2f2', '#b91c1c', f => porDia[f].fs) + fila('Disponibles', '#eff6ff', '#1d4ed8', f => porDia[f].disp);
}

function logoFail(im) {
  const d = document.createElement('div'); d.className = 'logo';
  d.style.background = im.dataset.bg; d.style.color = im.dataset.fg; d.textContent = im.dataset.ini;
  const p = im.parentNode; p.parentNode.replaceChild(d, p);
}

// ---------- Filtros ----------
function llenarFiltros() {
  const uniq = a => [...new Set(a)].filter(x => x && x !== '-').sort();
  const fill = (id, arr, ph) => { const s = $(id); const prev = s.value; s.innerHTML = `<option value=''>${ph}</option>` + arr.map(x => `<option>${esc(x)}</option>`).join(''); if (arr.indexOf(prev) >= 0) s.value = prev; };
  fill('fCli', uniq(DB.filas.map(f => f.cliente)), 'Todos los clientes');
  fill('fCon', uniq(DB.programacion.map(p => p.conductor)), 'Todos los conductores');
  fill('fTracto', uniq(DB.programacion.map(p => p.tracto)), 'Todos los tractos');
  fill('fSemi', uniq(DB.programacion.map(p => p.semi)), 'Todos los semirremolques');
  if (!$('fDesde').value) $('fDesde').value = (hoyIso() >= DB.desde && hoyIso() <= DB.hasta) ? hoyIso() : DB.desde;
}
function aplicarFiltros() {
  const cli = $('fCli').value, con = $('fCon').value, tra = $('fTracto').value, sem = $('fSemi').value;
  const fd = $('fDesde').value, fh = $('fHasta').value;
  document.querySelectorAll('[data-f]').forEach(el => {
    const f = el.getAttribute('data-f');
    el.style.display = ((!fd || f >= fd) && (!fh || f <= fh)) ? '' : 'none';
  });
  document.querySelectorAll('#body .ev').forEach(ev => {
    ev.style.display = ((!con || ev.dataset.con === con) && (!tra || ev.dataset.tracto === tra) && (!sem || ev.dataset.semi === sem)) ? '' : 'none';
  });
  document.querySelectorAll('#body tr').forEach(tr => {
    if (tr.classList.contains('sumrow') || !tr.dataset.cli) { tr.style.display = ''; return; }
    let vis = !cli || tr.dataset.cli === cli;
    if (vis && (con || tra || sem)) vis = [...tr.querySelectorAll('.ev')].some(ev => ev.style.display !== 'none' && ev.closest('td').style.display !== 'none');
    tr.style.display = vis ? '' : 'none';
  });
}
// Si el rango elegido se sale de lo cargado, se piden más días a la API
function cambioFechas() {
  const fd = $('fDesde').value, fh = $('fHasta').value;
  if (DB && ((fd && fd < DB.desde) || (fh && fh > DB.hasta))) {
    rangoManual = true;
    cargar(fd && fd < DB.desde ? fd : DB.desde, fh && fh > DB.hasta ? fh : DB.hasta);
  } else aplicarFiltros();
}

// ---------- Inicio ----------
document.addEventListener('DOMContentLoaded', () => {
  ['fCli', 'fCon', 'fTracto', 'fSemi'].forEach(id => $(id).addEventListener('change', aplicarFiltros));
  ['fDesde', 'fHasta'].forEach(id => $(id).addEventListener('change', cambioFechas));
  $('fClr').addEventListener('click', () => {
    ['fCli', 'fCon', 'fTracto', 'fSemi', 'fHasta'].forEach(id => { $(id).value = ''; });
    $('fDesde').value = ''; rangoManual = false; aplicarFiltros();
  });
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.ok) { DB = c; render(); } } catch (e) { /* sin caché */ }
  cargar();
  // Recarga periódica: con el rango por defecto la ventana avanza sola cada día (útil en la TV de la oficina)
  setInterval(() => { if (!document.hidden) rangoManual && DB ? cargar(DB.desde, DB.hasta) : cargar(); }, REFRESCO_MS);
});

/* ============================================================
   ETAPA 3 — MODO EDICIÓN
   PIN · editar día · filas de viaje · fuera de servicio · copiar días · maestros
   ============================================================ */
const SES_KEY = 'tc_prog_sesion_v1';
const KPI_NOMBRES = { '': '— Ninguno —', CARGA: 'En carga', TRANSITO: 'En tránsito', DESCARGA: 'En descarga', INTERNOS: 'Mov. internos' };
const DIAS_CORTOS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

// Restaurar sesión de la pestaña (se borra al cerrar el navegador)
try { const s = JSON.parse(sessionStorage.getItem(SES_KEY) || 'null'); if (s && s.pin) EDIT = s; } catch (e) { /* sin sesión */ }

// ---------- Llamadas a la API (escritura) ----------
async function api(accion, datos) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ accion, pin: EDIT && EDIT.pin }, datos || {})) });
  const d = await r.json();
  if (!d.ok) {
    if (/PIN incorrecto|Demasiados intentos/.test(d.error || '') && accion !== 'login') salirEdicion(true);
    throw new Error(d.error || 'Error al guardar');
  }
  return d;
}

// ---------- Avisos ----------
function aviso(txt, tipo) {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast ' + (tipo || 'ok'); t.textContent = txt; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, tipo === 'err' ? 6000 : 2800);
}

// ---------- Ventanas modales ----------
function abrirModal(titulo, subtitulo, cuerpo, pie, ancho) {
  cerrarModal();
  const o = document.createElement('div'); o.className = 'ovl'; o.id = 'ovl';
  o.innerHTML = `<div class='mdl' style='${ancho ? 'width:' + ancho + 'px' : ''}'><div class='mh'><div><h3>${titulo}</h3>${subtitulo ? `<p>${subtitulo}</p>` : ''}</div><button class='x' data-cerrar>×</button></div><div class='mb'>${cuerpo}</div>${pie ? `<div class='mf'>${pie}</div>` : ''}</div>`;
  o.addEventListener('mousedown', e => { if (e.target === o) cerrarModal(); });
  o.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', cerrarModal));
  document.body.appendChild(o);
  return o;
}
function cerrarModal() { const o = $('ovl'); if (o) o.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
// Bloquea los botones mientras se guarda
async function ocupado(btn, fn) {
  const bs = document.querySelectorAll('#ovl button'); bs.forEach(b => { b.disabled = true; });
  const txt = btn ? btn.textContent : ''; if (btn) btn.textContent = 'Guardando…';
  try { return await fn(); } catch (e) { aviso(e.message || String(e), 'err'); return null; }
  finally { bs.forEach(b => { b.disabled = false; }); if (btn) btn.textContent = txt; }
}
const opciones = (lista, actual, vacio) => (vacio != null ? `<option value=''>${vacio}</option>` : '') +
  lista.map(v => { const val = Array.isArray(v) ? v[0] : v, lab = Array.isArray(v) ? v[1] : v; return `<option value='${esc(val)}'${String(val) === String(actual) ? ' selected' : ''}>${esc(lab)}</option>`; }).join('');
// Lista de un maestro: activos + el valor actual aunque esté inactivo
function activos(lista, campo, actual) {
  const v = lista.filter(x => x.activo).map(x => x[campo]);
  if (actual && v.indexOf(actual) < 0) v.unshift(actual);
  return v;
}
const diaTxt = f => DIAS_CORTOS[desdeIso(f).getDay()] + ' ' + fechaCorta(f);

// ============================================================
function cruces(filaId, fecha, conductor, tracto, semi) {
  const out = [], fila = id => DB.filas.find(f => f.id === id) || {};
  DB.programacion.forEach(p => {
    if (p.fecha !== fecha || p.filaId === filaId) return;
    const fl = fila(p.filaId), donde = `${fl.cliente} · ${fl.origen} → ${fl.destino}`;
    if (tracto && p.tracto === tracto) out.push(`${tracto} ya está asignado en ${donde}`);
    if (semi && p.semi === semi) out.push(`${semi} ya está asignado en ${donde}`);
    if (conductor && conductor !== 'DEFINIR' && p.conductor === conductor) out.push(`${conductor} ya está asignado en ${donde}`);
  });
  if (tracto && DB.fueraServicio.some(x => x.tracto === tracto && x.desde <= fecha && x.hasta >= fecha)) out.push(`${tracto} está fuera de servicio ese día`);
  return out;
}
function editarCelda(filaId, fecha) {
  const fl = DB.filas.find(f => f.id === filaId); if (!fl) return;
  const p = DB.programacion.find(x => x.filaId === filaId && x.fecha === fecha) || {};
  const est = DB.estados.filter(e => e.activo || e.codigo === p.estado);
  const tip = DB.tiposServicio.filter(t => t.activo || t.codigo === p.tipo);
  let estado = p.estado || '', tipo = p.tipo || '';
  const chipE = est.map(e => `<button class='chip${e.codigo === estado ? ' on' : ''}' data-e='${esc(e.codigo)}'><i style='background:${esc(e.color)}'></i>${esc(e.nombre || e.codigo)}</button>`).join('') +
    `<button class='chip${!estado ? ' on' : ''}' data-e=''><i style='background:#94a3b8'></i>Sin movimiento</button>`;
  const chipT = `<button class='chip${!tipo ? ' on' : ''}' data-t=''>Normal</button>` + tip.map(t => `<button class='chip${t.codigo === tipo ? ' on' : ''}' data-t='${esc(t.codigo)}'><i style='background:${esc(t.color)}'></i>${esc(t.nombre || t.codigo)}</button>`).join('');
  const cond = activos(DB.conductores, 'nombre', p.conductor).filter(x => x !== 'DEFINIR');
  const tra = activos(DB.tractos, 'patente', p.tracto), sem = activos(DB.semirremolques, 'patente', p.semi);
  abrirModal(p.estado ? 'Editar programación' : 'Asignar día', `${esc(fl.cliente)} · ${esc(fl.origen)} → ${esc(fl.destino)} · ${DIAS_SEM[desdeIso(fecha).getDay()]} ${fechaCorta(fecha)}`, `
    <div class='full'><div class='fl'>Estado del día</div><div class='chips' id='chE'>${chipE}</div></div>
    <div class='full dep'><div class='fl'>Tipo de servicio</div><div class='chips' id='chT'>${chipT}</div></div>
    <div class='full dep'><div class='fl'>Conductor</div><select id='eCon' class='inp'>${opciones([['DEFINIR', 'POR DEFINIR']].concat(cond), p.conductor || 'DEFINIR')}</select></div>
    <div class='dep'><div class='fl'>Tracto</div><select id='eTra' class='inp'>${opciones([['', '—'], ['DEFINIR', 'POR DEFINIR']].concat(tra), p.tracto || '')}</select></div>
    <div class='dep'><div class='fl'>Semirremolque</div><select id='eSem' class='inp'>${opciones([['', '—'], ['DEFINIR', 'POR DEFINIR']].concat(sem), p.semi || '')}</select></div>
    <div class='full' id='eWarn'></div>
    <div class='full rep'><label><input type='checkbox' id='eRep'> Repetir hasta</label><input type='date' id='eHasta' class='inp sm' min='${sumarDias(fecha, 1)}' value='${sumarDias(fecha, 3)}' disabled><span class='hint2' id='eRepN'></span></div>`,
    `${p.estado ? `<button class='eb del' id='eDel'>Dejar sin movimiento</button>` : ''}<span class='sp'></span><button class='eb eb-g' data-cerrar>Cancelar</button><button class='eb eb-p' id='eOk'>Guardar</button>`);
  const fechas = () => {
    if (!$('eRep').checked) return [fecha];
    const h = $('eHasta').value, out = [];
    for (let f = fecha; h && f <= h && out.length < 120; f = sumarDias(f, 1)) out.push(f);
    return out.length ? out : [fecha];
  };
  const refrescar = () => {
    document.querySelectorAll('#ovl .dep').forEach(x => { x.style.display = estado ? '' : 'none'; });
    $('eHasta').disabled = !$('eRep').checked;
    const fs = fechas(); $('eRepN').textContent = fs.length > 1 ? fs.length + ' días' : '';
    if (!estado) { $('eWarn').innerHTML = ''; return; }
    const c = $('eCon').value, t = $('eTra').value, s = $('eSem').value, msgs = [];
    fs.forEach(f => cruces(filaId, f, c, t, s).forEach(m => msgs.push((fs.length > 1 ? diaTxt(f) + ': ' : '') + m)));
    $('eWarn').innerHTML = msgs.length ? `<div class='warn'>⚠ ${msgs.slice(0, 4).map(esc).join('<br>⚠ ')}${msgs.length > 4 ? `<br>… y ${msgs.length - 4} cruces más` : ''}</div>` : '';
  };
  $('chE').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; estado = b.dataset.e; $('chE').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); refrescar(); });
  $('chT').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; tipo = b.dataset.t; $('chT').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); });
  ['eCon', 'eTra', 'eSem', 'eRep', 'eHasta'].forEach(id => $(id).addEventListener('change', refrescar));
  refrescar();
  const guardar = (btn, sinMov) => ocupado(btn, async () => {
    const celdas = fechas().map(f => sinMov || !estado
      ? { filaId, fecha: f, estado: 'SM' }
      : { filaId, fecha: f, estado, tipo, conductor: $('eCon').value, tracto: $('eTra').value, semi: $('eSem').value });
    const r = await api('guardarCeldas', { celdas });
    cerrarModal(); await recargar();
    aviso(`Guardado: ${r.nuevas} nuevas, ${r.modificadas} modificadas, ${r.borradas} sin movimiento`);
  });
  $('eOk').addEventListener('click', e => guardar(e.target, false));
  if ($('eDel')) $('eDel').addEventListener('click', e => guardar(e.target, true));
}

function editarFila(id) {

  if (!fl) return;

    <div class='full'><div class='fl'>Cliente</div><select id='rCli' class='inp'>${opciones(cls, fl.cliente, '— Elegir cliente —')}</select>
      <div class='hint2'>¿No está en la lista? Agrégalo en <a href='#' id='rIrCli'>Maestros → Clientes</a>.</div></div>
    <div><div class='fl'>Origen</div><input id='rOri' class='inp' value='${esc(fl.origen)}' list='dlLug'></div>
    <div><div class='fl'>Destino</div><input id='rDes' class='inp' value='${esc(fl.destino)}' list='dlLug'></div>
    <datalist id='dlLug'>${[...new Set(DB.filas.flatMap(f => [f.origen, f.destino]).filter(Boolean))].sort().map(x => `<option value='${esc(x)}'>`).join('')}</datalist>
    ${id ? `<div class='full'><div class='fl'>Posición en la tabla</div><div class='chips'><button class='chip' id='rUp' ${pos <= 0 ? 'disabled' : ''}>▲ Subir</button><button class='chip' id='rDown' ${pos >= DB.filas.length - 1 ? 'disabled' : ''}>▼ Bajar</button></div></div>` : ''}`,
    `${id ? `<button class='eb del' id='rDel'>Quitar viaje</button>` : ''}<span class='sp'></span><button class='eb eb-g' data-cerrar>Cancelar</button><button class='eb eb-p' id='rOk'>Guardar</button>`);
  $('rIrCli').onclick = e => { e.preventDefault(); maestros('Clientes'); };
  $('rOk').onclick = e => ocupado(e.target, async () => {
    const cliente = $('rCli').value; if (!cliente) throw new Error('Elige un cliente');
    await api('guardarFila', { fila: { id: id || undefined, cliente, origen: $('rOri').value, destino: $('rDes').value } });
    cerrarModal(); await recargar(); aviso(id ? 'Viaje actualizado' : 'Viaje agregado');
  });
  if (id) {
    $('rDel').onclick = e => {
      if (!confirmar(`¿Quitar el viaje ${fl.cliente} · ${fl.origen} → ${fl.destino}? Su historial se conserva en la base de datos.`)) return;
      ocupado(e.target, async () => {
        await api('guardarFila', { fila: { id, cliente: fl.cliente, origen: fl.origen, destino: fl.destino, activa: false } });
        cerrarModal(); await recargar(); aviso('Viaje quitado');
      });
    };
    const mover = (btn, d) => ocupado(btn, async () => {
      const ids = DB.filas.map(f => f.id), i = ids.indexOf(id), j = i + d;
      if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      await api('ordenarFilas', { ids });
      await recargar(); editarFila(id);
    });
    $('rUp').onclick = e => mover(e.target, -1);
    $('rDown').onclick = e => mover(e.target, 1);
  }
}

// ============================================================
//  COPIAR DÍAS (p.ej. repetir una semana)
// ============================================================
function copiarDias() {
  const h = hoyIso();
  abrirModal('Copiar días', 'Copia la programación de un rango de días a otras fechas (todas las filas)', `
    <div><div class='fl'>Copiar desde</div><input id='cDe' type='date' class='inp' value='${h}' min='${DB.desde}' max='${DB.hasta}'></div>
    <div><div class='fl'>Hasta</div><input id='cHa' type='date' class='inp' value='${sumarDias(h, 6)}' min='${DB.desde}' max='${DB.hasta}'></div>
    <div class='full'><div class='fl'>Pegar a partir del</div><input id='cDest' type='date' class='inp' value='${sumarDias(h, 7)}'></div>
    <div class='full rep'><label><input type='checkbox' id='cSM'> Incluir los días "Sin movimiento" (borra lo que haya en el destino)</label></div>
    <div class='full' id='cRes'></div>`,
    `<span class='sp'></span><button class='eb eb-g' data-cerrar>Cancelar</button><button class='eb eb-p' id='cOk'>Copiar</button>`, 520);
  const calcular = () => {
    const de = $('cDe').value, ha = $('cHa').value, dest = $('cDest').value, out = [];
    if (!de || !ha || !dest || ha < de) return { out, err: 'Revisa las fechas' };
    if (de < DB.desde || ha > DB.hasta) return { out, err: `El origen debe estar entre ${fechaCorta(DB.desde)} y ${fechaCorta(DB.hasta)} (amplía el filtro de fechas si necesitas otro rango)` };
    const off = Math.round((desdeIso(dest) - desdeIso(de)) / 864e5);
    if (off === 0) return { out, err: 'El destino no puede ser igual al origen' };
    for (let f = de; f <= ha; f = sumarDias(f, 1)) {
      DB.filas.forEach(fl => {
        const p = DB.programacion.find(x => x.filaId === fl.id && x.fecha === f), nf = sumarDias(f, off);
        if (p) out.push({ filaId: fl.id, fecha: nf, estado: p.estado, tipo: p.tipo, conductor: p.conductor, tracto: p.tracto, semi: p.semi });
        else if ($('cSM').checked) out.push({ filaId: fl.id, fecha: nf, estado: 'SM' });
      });
    }
    return { out, dias: Math.round((desdeIso(ha) - desdeIso(de)) / 864e5) + 1, hastaDest: sumarDias(ha, off) };
  };
  const ver = () => {
    const r = calcular();
    $('cRes').innerHTML = r.err ? `<div class='warn'>${esc(r.err)}</div>` :
      `<div class='okbox'>Se copiarán <b>${r.out.filter(c => c.estado !== 'SM').length}</b> asignaciones de ${r.dias} días al rango ${fechaCorta($('cDest').value)} – ${fechaCorta(r.hastaDest)}.${r.out.length > 500 ? '<br>⚠ Son más de 500 celdas: elige un rango más corto.' : ''}</div>`;
  };
  ['cDe', 'cHa', 'cDest', 'cSM'].forEach(id => $(id).addEventListener('change', ver)); ver();
  $('cOk').onclick = e => ocupado(e.target, async () => {
    const r = calcular(); if (r.err) throw new Error(r.err);
    if (!r.out.length) throw new Error('No hay asignaciones para copiar en ese rango');
    const res = await api('guardarCeldas', { celdas: r.out });
    cerrarModal(); await recargar();
    aviso(`Copiado: ${res.nuevas} nuevas, ${res.modificadas} reemplazadas${res.borradas ? ', ' + res.borradas + ' sin movimiento' : ''}`);
  });
}

  Conductores:    { tit: 'Conductores', uno: 'conductor', clave: 'nombre', lista: () => DB.conductores, campos: [['nombre', 'Nombre', 'text'], ['activo', 'Activo', 'bool']] },
  Tractos:        { tit: 'Tractos', uno: 'tracto', clave: 'patente', lista: () => DB.tractos, campos: [['patente', 'Patente', 'text'], ['propio', 'Propio (se cuenta en disponibles)', 'bool'], ['activo', 'Activo', 'bool']] },
  Semirremolques: { tit: 'Semirremolques', uno: 'semirremolque', clave: 'patente', lista: () => DB.semirremolques, campos: [['patente', 'Patente', 'text'], ['activo', 'Activo', 'bool']] },
  Clientes:       { tit: 'Clientes', uno: 'cliente', clave: 'nombre', lista: () => DB.clientes, campos: [['nombre', 'Nombre', 'text'], ['logo', 'Logo', 'logo'], ['color', 'Color del círculo (sin logo)', 'color'], ['colorInicial', 'Color de la inicial', 'color'], ['activo', 'Activo', 'bool']] },
  Estados:        { tit: 'Estados del día', uno: 'estado', clave: 'codigo', fija: true, lista: () => DB.estados, campos: [['codigo', 'Código (no se puede cambiar después)', 'code'], ['nombre', 'Nombre visible', 'text'], ['color', 'Color', 'color'], ['kpi', 'Se cuenta en el indicador', 'kpi'], ['orden', 'Orden', 'number'], ['activo', 'Activo', 'bool']] },
  TiposServicio:  { tit: 'Tipos de servicio', uno: 'tipo de servicio', clave: 'codigo', fija: true, lista: () => DB.tiposServicio, campos: [['codigo', 'Código (no se puede cambiar después)', 'code'], ['nombre', 'Nombre visible', 'text'], ['color', 'Color de la etiqueta', 'color'], ['activo', 'Activo', 'bool']] },
  Usuarios:       { tit: 'Usuarios', uno: 'usuario', clave: 'nombre', admin: true, lista: () => USUARIOS, campos: [['nombre', 'Nombre', 'text'], ['pin', 'PIN (4 a 8 dígitos)', 'pin'], ['rol', 'Rol', 'rol'], ['activo', 'Activo', 'bool']] },
  Config:         { tit: 'Configuración', admin: true }
};
let USUARIOS = [];

async function maestros(tipo, editar) {
  const m = MAE[tipo];
  if (m.admin && EDIT.rol !== 'admin') { aviso('Solo un administrador puede ver esta sección', 'err'); return; }
  if (tipo === 'Usuarios' && editar === undefined) {
    try { USUARIOS = (await api('listarUsuarios')).usuarios; } catch (e) { aviso(e.message, 'err'); return; }
  }
  const tabs = Object.keys(MAE).filter(k => !MAE[k].admin || EDIT.rol === 'admin')
    .map(k => `<button class='tab${k === tipo ? ' on' : ''}' data-tab='${k}'>${MAE[k].tit}</button>`).join('');
  let cuerpo;
  if (tipo === 'Config') cuerpo = formConfig();
  else {
    const lista = m.lista().slice();
    const reg = editar === null ? nuevoRegistro(tipo) : (editar !== undefined ? lista.find(r => String(r[m.clave]) === String(editar)) : null);
    cuerpo = (reg ? formMaestro(tipo, reg, editar === null) : `<div class='full'><button class='eb eb-p' id='mNuevo'>＋ Agregar ${m.uno}</button></div>`) + listaMaestro(tipo, lista);
  }
  abrirModal('Maestros', 'Listas que alimentan los formularios', `<div class='full tabs'>${tabs}</div>${cuerpo}`,
    `<span class='sp'></span><button class='eb eb-g' data-cerrar>Cerrar</button>`, 760);
  document.querySelectorAll('#ovl [data-tab]').forEach(b => { b.onclick = () => maestros(b.dataset.tab); });
  if ($('mNuevo')) $('mNuevo').onclick = () => maestros(tipo, null);
  document.querySelectorAll('#ovl [data-mae]').forEach(b => { b.onclick = () => maestros(tipo, b.dataset.mae); });
  if (tipo === 'Config') montarConfig();
  else if ($('mOk')) montarFormMaestro(tipo, editar);
}
function nuevoRegistro(tipo) {
  return { Conductores: { nombre: '', activo: true }, Tractos: { patente: '', propio: true, activo: true }, Semirremolques: { patente: '', activo: true },
    Clientes: { nombre: '', logo: '', color: '#1e6fa8', colorInicial: '#ffffff', activo: true },
    Estados: { codigo: '', nombre: '', color: '#0ea5e9', kpi: '', orden: (DB.estados.length + 1), activo: true },
    TiposServicio: { codigo: '', nombre: '', color: '#7c3aed', activo: true }, Usuarios: { nombre: '', pin: '', rol: 'editor', activo: true } }[tipo];
}
function srcLogo(l) { return l ? (/^https?:/i.test(l) ? l : 'Logos/' + l) : ''; }
function listaMaestro(tipo, lista) {
  const m = MAE[tipo];
  if (!lista.length) return `<div class='full hint2'>Todavía no hay registros.</div>`;
  const cols = m.campos.filter(c => c[2] !== 'pin');
  const celda = (r, c) => {
    const v = r[c[0]];
    if (c[2] === 'bool') return v ? `<span class='si'>Sí</span>` : `<span class='no'>No</span>`;
    if (c[2] === 'color') return `<span class='sw' style='background:${esc(v)}'></span>`;
    if (c[2] === 'logo') return v ? `<img class='mini' src='${esc(srcLogo(v))}' alt=''>` : `<span class='logo mini2' style='background:${esc(r.color)};color:${esc(r.colorInicial)}'>${esc((r.nombre || '?')[0])}</span>`;
    if (c[2] === 'kpi') return esc(KPI_NOMBRES[v || ''] || v);
    return esc(v);
  };
  const ord = lista.slice().sort((a, b) => (b.activo - a.activo) || (tipo === 'Estados' ? (+a.orden || 99) - (+b.orden || 99) : String(a[m.clave]).localeCompare(String(b[m.clave]))));
  return `<div class='full'><table class='tb'><tr>${cols.map(c => `<th>${esc(c[1].replace(/ \(.*\)/, ''))}</th>`).join('')}<th></th></tr>` +
    ord.map(r => `<tr class='${r.activo ? '' : 'inact'}'>${cols.map(c => `<td>${celda(r, c)}</td>`).join('')}<td class='acc'><button class='lnk' data-mae='${esc(r[m.clave])}'>Editar</button></td></tr>`).join('') + '</table></div>';
}
function formMaestro(tipo, r, nuevo) {
  const m = MAE[tipo];
  const campo = c => {
    const [k, lab, t] = c, v = r[k] == null ? '' : r[k], id = 'm_' + k;
    if (t === 'bool') return `<div class='full rep'><label><input type='checkbox' id='${id}' ${v ? 'checked' : ''}> ${lab}</label></div>`;
    if (t === 'color') return `<div><div class='fl'>${lab}</div><div class='colrow'><input type='color' id='${id}' value='${esc(v || '#1e6fa8')}'><input class='inp' id='${id}_t' value='${esc(v || '#1e6fa8')}' maxlength='7'></div></div>`;
    if (t === 'kpi') return `<div><div class='fl'>${lab}</div><select class='inp' id='${id}'>${opciones(Object.keys(KPI_NOMBRES).map(x => [x, KPI_NOMBRES[x]]), v)}</select></div>`;
    if (t === 'rol') return `<div><div class='fl'>${lab}</div><select class='inp' id='${id}'>${opciones([['editor', 'Editor (programa y edita maestros)'], ['admin', 'Administrador (además usuarios y configuración)']], v)}</select></div>`;
    if (t === 'pin') return `<div><div class='fl'>${lab}</div><input class='inp' id='${id}' inputmode='numeric' maxlength='8' autocomplete='off' placeholder='${nuevo ? '' : 'Dejar vacío para no cambiarlo'}'></div>`;
    if (t === 'logo') return `<div class='full'><div class='fl'>${lab}</div><div class='logorow'><div class='lprev' id='mLogoPrev'>${v ? `<img src='${esc(srcLogo(v))}' alt=''>` : '<span>Sin logo</span>'}</div><div><input type='file' id='mLogoF' accept='image/png,image/jpeg,image/webp'><div class='hint2'>PNG o JPG. Se ajusta el tamaño automáticamente. Se sube al presionar Guardar.</div></div></div></div>`;
    const dis = t === 'code' && m.fija && !nuevo ? 'disabled' : '';
    return `<div${t === 'text' && k === 'nombre' && tipo !== 'Estados' ? " class='full'" : ''}><div class='fl'>${lab}</div><input class='inp' id='${id}' value='${esc(v)}' ${t === 'number' ? "type='number' min='1'" : ''} ${dis} ${t === 'code' ? "style='text-transform:uppercase'" : ''}></div>`;
  };
  return `<div class='full sub'>${nuevo ? 'Agregar' : 'Editar'} · ${esc(m.tit)}</div>${m.campos.map(campo).join('')}
    <div class='full'><button class='eb eb-p' id='mOk'>Guardar</button> <button class='eb eb-g' id='mCan'>Cancelar</button>${!nuevo && (tipo === 'Conductores' || tipo === 'Tractos' || tipo === 'Semirremolques' || tipo === 'Clientes') ? `<div class='hint2'>Si cambias el nombre o la patente, también se corrige en toda la programación ya cargada.</div>` : ''}</div>
    <div class='full sep'></div>`;
}
let _logoNuevo = null;
function montarFormMaestro(tipo, claveOriginal) {
  const m = MAE[tipo]; _logoNuevo = null;
  m.campos.filter(c => c[2] === 'color').forEach(c => {
    const a = $('m_' + c[0]), b = $('m_' + c[0] + '_t');
    a.oninput = () => { b.value = a.value; }; b.oninput = () => { if (/^#[0-9a-f]{6}$/i.test(b.value)) a.value = b.value; };
  });
  if ($('mLogoF')) $('mLogoF').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { _logoNuevo = await reducirImagen(f); $('mLogoPrev').innerHTML = `<img src='data:${_logoNuevo.mime};base64,${_logoNuevo.base64}' alt=''>`; }
    catch (err) { aviso(err.message, 'err'); e.target.value = ''; }
  };
  $('mCan').onclick = () => maestros(tipo);
  $('mOk').onclick = e => ocupado(e.target, async () => {
    const reg = {}, orig = claveOriginal === null || claveOriginal === undefined ? null : m.lista().find(r => String(r[m.clave]) === String(claveOriginal));
    m.campos.forEach(([k, , t]) => {
      if (t === 'logo') { reg.logo = orig ? orig.logo : ''; return; }
      const el = $('m_' + k); if (!el) return;
      reg[k] = t === 'bool' ? el.checked : (t === 'color' ? $('m_' + k + '_t').value.trim() : el.value.trim());
    });
    if (m.fija && orig) reg[m.clave] = orig[m.clave];
    const res = await api('guardarMaestro', { tipo, registro: reg, claveOriginal: orig ? orig[m.clave] : undefined });
    if (_logoNuevo) await api('subirLogo', { cliente: res.clave || reg.nombre, archivo: _logoNuevo });
    await recargar();
    aviso(`${m.tit}: ${res.clave || reg[m.clave]} guardado${res.actualizados ? ` (corregido en ${res.actualizados} registros)` : ''}`);
    maestros(tipo);
  });
}
// Reduce el logo a máx. 400×200 px y lo convierte a PNG (mantiene transparencia)
function reducirImagen(file) {
  return new Promise((ok, mal) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return mal(new Error('Formato no permitido: usa PNG o JPG'));
    if (file.size > 8e6) return mal(new Error('La imagen pesa más de 8 MB'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 400 / img.width, 200 / img.height);
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok({ mime: 'image/png', base64: c.toDataURL('image/png').split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
function formConfig() {
  const c = DB.config || {};
  return `<div class='full sub'>Parámetros generales</div>
    <div class='full'><div class='fl'>Título de la página</div><input class='inp' id='cfTit' value='${esc(c.Titulo || '')}'></div>
    <div class='full'><div class='fl'>Empresa</div><input class='inp' id='cfEmp' value='${esc(c.Empresa || '')}'></div>
    <div><div class='fl'>Días hacia atrás que se muestran</div><input class='inp' id='cfAtr' type='number' min='0' max='365' value='${esc(c.DiasAtras || '7')}'></div>
    <div><div class='fl'>Días hacia adelante que se muestran</div><input class='inp' id='cfAde' type='number' min='1' max='365' value='${esc(c.DiasAdelante || '28')}'></div>
    <div class='full'><button class='eb eb-p' id='cfOk'>Guardar configuración</button></div>`;
}
function montarConfig() {
  $('cfOk').onclick = e => ocupado(e.target, async () => {
    await api('guardarConfig', { config: { Titulo: $('cfTit').value, Empresa: $('cfEmp').value, DiasAtras: $('cfAtr').value, DiasAdelante: $('cfAde').value } });
    rangoManual = false; await cargar(); aviso('Configuración guardada'); maestros('Config');
  });
}

</script>
